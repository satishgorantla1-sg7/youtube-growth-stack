name: Bug report
description: Report reproducible unexpected behavior
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest set of steps and non-sensitive example input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and environment
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Never paste tokens, transcripts, recordings, or private user data.
